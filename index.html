<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
            html, body {
                background-color: #ffffff;
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }

            #map {
                width: 100%;
                height: 100%;
            }

            .ol-control > * {
                background-color: #f8f8f8!important;
                color: #444444!important;
                border-radius: 0px;
            }

            .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
                color: #444444!important;
            }

            .search-layer-input-search {
                background-color: #f8f8f8!important;
            }

            .ol-control > *:focus, .ol-control >*:hover {
                background-color: rgba(248, 248, 248, 0.7)!important;
            } 

            .ol-control {
                background-color: rgba(255,255,255,.4) !important;
                padding: 2px !important;
            } 

            /* Ancho del Pop-up para PC */
            .ol-popup {
                min-width: 400px !important;
            }

            /* Título pequeño flotante y sutil */
            #map-title {
                position: absolute;
                top: 15px;
                left: 55px;
                background: rgba(255, 255, 255, 0.9);
                padding: 6px 12px;
                font-family: sans-serif;
                font-size: 14px;
                font-weight: bold;
                color: #333;
                border-radius: 4px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.3);
                z-index: 1000;
                pointer-events: none;
            }

            /* Adaptabilidad responsive para celulares */
            @media screen and (max-width: 768px) {
                .ol-popup {
                    max-width: 90% !important;
                    width: 90% !important;
                    left: 5% !important;
                    right: 5% !important;
                    bottom: 20px !important;
                    top: auto !important;
                    transform: none !important;
                }
                .ol-popup-content {
                    max-height: 250px;
                    overflow-y: auto;
                }
            }
        </style>

        <title>Luminarias Junín</title>
    </head>
    <body>
        <!-- Título flotante compacto -->
        <div id="map-title">Luminarias Junín</div>

        <!-- Contenedor único del mapa -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <!-- Scripts necesarios -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="layers/LuminariasJunin_2.js"></script>
        <script src="styles/LuminariasJunin_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>    
    </body>
</html>
